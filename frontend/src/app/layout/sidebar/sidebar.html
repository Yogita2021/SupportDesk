
<aside class="sidebar">
  <a routerLink="/tickets/my-tickets" class="brand">
    <span class="brand-icon">🎧</span>
    <span>SupportDesk</span>
  </a>

  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
      <span class="nav-icon">▦</span>
      <span>Dashboard</span>
    </a>

    <a routerLink="/tickets/create" routerLinkActive="active"  [routerLinkActiveOptions]="{ exact: true }"
       class="nav-link">
      <span class="nav-icon">⊕</span>
      <span>Create Ticket</span>
    </a>

    <a routerLink="/tickets" routerLinkActive="active"
       class="nav-link">
      <span class="nav-icon">▣</span>
      <span>My Tickets</span>
    </a>

    <a routerLink="/profile" routerLinkActive="active"
       class="nav-link">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </a>
  </nav>

  <button type="button" class="logout-btn" (click)="logout()">
    <span class="nav-icon">⇥</span>
    <span>Logout</span>
  </button>
</aside>
